<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio — ฝึกงาน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F7F6F2;
            --surface: #FFFFFF;
            --ink: #17181C;
            --muted: #6E7075;
            --line: #E1DFD8;
            --accent: #3B5FE0;
            --accent-soft: #EAEEFC;
            --radius: 3px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        h1,
        h2,
        h3,
        .mono {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ---------- Header ---------- */
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(247, 246, 242, 0.9);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--line);
        }

        .header-inner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--ink);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 4px;
        }

        nav button {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 7px 14px;
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius);
            color: var(--muted);
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }

        nav button:hover {
            color: var(--ink);
        }

        nav button.active {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .lang-toggle {
            display: flex;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 3px;
            background: var(--surface);
        }

        .lang-toggle button {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 16px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--muted);
            transition: background .15s ease, color .15s ease;
        }

        .lang-toggle button.active {
            background: var(--ink);
            color: #fff;
        }

        /* ---------- Hero ---------- */
        .hero {
            max-width: 1080px;
            margin: 0 auto;
            padding: 72px 24px 56px;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            right: 24px;
            width: 220px;
            height: 220px;
            background-image: radial-gradient(var(--line) 1.4px, transparent 1.4px);
            background-size: 16px 16px;
            opacity: 0.7;
            pointer-events: none;
        }

        .eyebrow-name {
            font-size: 15px;
            color: var(--muted);
            margin: 0 0 10px;
        }

        .eyebrow-name .edit {
            color: var(--accent);
        }

        h1.title {
            font-size: clamp(30px, 4.5vw, 46px);
            font-weight: 600;
            margin: 0 0 18px;
            max-width: 14ch;
            line-height: 1.15;
        }

        .hero p.desc {
            max-width: 56ch;
            color: var(--muted);
            font-size: 16px;
            margin: 0;
        }

        /* ---------- Sections / Grid ---------- */
        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        .group {
            margin-top: 56px;
        }

        .group-head {
            display: flex;
            align-items: baseline;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .group-head h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 0;
        }

        .group-head .count {
            font-size: 13px;
            color: var(--muted);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin-bottom: 24px;
            font-family: 'Inter', sans-serif;
        }

        .back-link:hover {
            color: var(--ink);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: border-color .15s ease, transform .15s ease;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .card-thumb {
            aspect-ratio: 16/10;
            background:
                linear-gradient(135deg, var(--accent-soft), var(--bg));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            overflow: hidden;
        }

        .card-thumb img,
        .card-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* เพิ่มหรือตรวจสอบบรรทัดนี้ เพื่อให้รูปภาพซูมและตัดส่วนเกินให้พอดีกรอบ โดยไม่ผิดเพี้ยน */
            object-position: top;
        }

        .play-badge {
            display: none !important;
            /* เพิ่มบรรทัดนี้เพื่อซ่อนปุ่ม */
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
        }

        .play-badge svg {
            width: 14px;
            height: 14px;
            fill: var(--ink);
        }

        .card-body {
            padding: 16px 16px 18px;
        }

        .card-tag {
            font-size: 11.5px;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 6px;
            display: block;
        }

        .card-body h3 {
            font-size: 16.5px;
            font-weight: 600;
            margin: 0 0 6px;
        }

        .card-body p {
            font-size: 13.5px;
            color: var(--muted);
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            margin-top: 10px;
        }

        .card-link:hover {
            text-decoration: underline;
        }

        .card-link svg {
            width: 11px;
            height: 11px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
        }

        /* ---------- Empty state ---------- */
        .empty {
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            padding: 40px 24px;
            text-align: left;
            color: var(--muted);
            font-size: 14.5px;
            max-width: 560px;
        }

        .empty strong {
            color: var(--ink);
            display: block;
            font-size: 15.5px;
            margin-bottom: 6px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .empty code {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 1px 6px;
            border-radius: 2px;
            font-size: 13px;
        }

        /* ---------- Modal ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(23, 24, 28, 0.55);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .overlay.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            max-width: 820px;
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
            animation: pop .18s ease;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0F1013;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-video video {
            width: 100%;
            height: 100%;
        }

        .modal-video .no-video {
            color: #8A8D93;
            font-size: 13.5px;
            font-family: 'Inter', sans-serif;
        }

        .modal-body {
            padding: 28px 30px 32px;
        }

        .modal-tag {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .modal-body h2 {
            font-size: 22px;
            margin: 0 0 12px;
        }

        .modal-body p.d {
            font-size: 14.5px;
            color: var(--ink);
            margin: 0 0 20px;
            line-height: 1.65;
        }

        .meta-row {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            border-top: 1px solid var(--line);
            padding-top: 16px;
        }

        .meta-item .label {
            font-size: 11.5px;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .meta-item .val {
            font-size: 14px;
            color: var(--ink);
            font-weight: 500;
        }

        .modal-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            padding: 9px 16px;
            border-radius: var(--radius);
            text-decoration: none;
            margin-top: 20px;
        }

        .modal-link:hover {
            opacity: 0.9;
        }

        .modal-link svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--ink);
        }

        .modal-wrap {
            position: relative;
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 26px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>

        const state = { filter: 'all', lang: 'th' };
        const main = document.getElementById('main');

        function t() { return i18n[state.lang]; }
        function catLabel(cat) { return cat === 'hardware' ? t().filterHW : t().filterSW; }
        function field(p, key) {
            // คืนค่าภาษาอังกฤษถ้ามีและกำลังใช้ EN, ไม่งั้น fallback เป็นค่าไทย/ค่าเดิม
            if (state.lang === 'en' && p[key + '_en']) return p[key + '_en'];
            return p[key];
        }

        function playIcon() {
            return '<span class="play-badge"><svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6V2z"/></svg></span>';
        }

        function cardHTML(p, idx) {
            return `
    <div class="card" tabindex="0" role="button" data-idx="${idx}">
      <div class="card-thumb">
        ${p.image ? `<img src="${p.image}" alt="cover">` : ''}
        ${p.video ? playIcon() : (!p.image ? t().noMedia : '')}
      </div>
      <div class="card-body">
        <span class="card-tag">${catLabel(p.category).toUpperCase()}</span>
        <h3>${field(p, 'title') || t().noTitle}</h3>
        <p>${field(p, 'description') || ''}</p>
        ${p.link ? `<a class="card-link" href="${p.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${field(p, 'linkLabel') || t().viewLabel}${arrowIcon()}</a>` : ''}
      </div>
    </div>`;
        }

        function arrowIcon() {
            return '<svg viewBox="0 0 12 12"><path d="M3 9L9 3M4 3h5v5"/></svg>';
        }

        function emptyHTML(cat) {
            return `
    <div class="empty">
      <strong>${t().emptyPrefix} ${catLabel(cat)}</strong>
      ${t().emptyBody(cat)}
    </div>`;
        }

        function render() {
            const f = state.filter;
            let html = '';

            if (f === 'all') {
                ['hardware', 'software'].forEach(cat => {
                    const items = projects.map((p, i) => ({ ...p, idx: i })).filter(p => p.category === cat);
                    html += `<div class="group">
        <div class="group-head">
          <h2>${catLabel(cat)}</h2>
          <span class="count">${items.length} ${t().countSuffix}</span>
        </div>
        ${items.length ? `<div class="grid">${items.map(p => cardHTML(p, p.idx)).join('')}</div>` : emptyHTML(cat)}
      </div>`;
                });
            } else {
                const items = projects.map((p, i) => ({ ...p, idx: i })).filter(p => p.category === f);
                html += `<button class="back-link" id="backBtn">${t().back}</button>
      <div class="group-head">
        <h2>${catLabel(f)}</h2>
        <span class="count">${items.length} ${t().countSuffix}</span>
      </div>
      ${items.length ? `<div class="grid">${items.map(p => cardHTML(p, p.idx)).join('')}</div>` : emptyHTML(f)}`;
            }

            main.innerHTML = html;

            main.querySelectorAll('.card').forEach(c => {
                c.addEventListener('click', () => openModal(projects[+c.dataset.idx]));
                c.addEventListener('keypress', e => { if (e.key === 'Enter') openModal(projects[+c.dataset.idx]); });
            });
            const back = document.getElementById('backBtn');
            if (back) back.addEventListener('click', () => setFilter('all'));
        }

        function applyStaticText() {
            document.getElementById('heroName').textContent = t().heroName;
            document.querySelector('[data-filter="all"]').textContent = t().filterAll;
            document.querySelector('[data-filter="hardware"]').textContent = t().filterHW;
            document.querySelector('[data-filter="software"]').textContent = t().filterSW;
            document.getElementById('heroRole').textContent = t().heroRole;
            document.getElementById('heroTitle').textContent = t().heroTitle;
            document.getElementById('heroDesc').textContent = t().heroDesc;
            document.getElementById('footerText').textContent = t().footer;
            document.documentElement.lang = state.lang;
        }

        function setFilter(f) {
            state.filter = f;
            document.querySelectorAll('#nav button').forEach(b => {
                b.classList.toggle('active', b.dataset.filter === f);
            });
            render();
        }

        function setLang(l) {
            state.lang = l;
            document.querySelectorAll('#langToggle button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === l);
            });
            applyStaticText();
            render();
        }

        document.querySelectorAll('#nav button').forEach(b => {
            b.addEventListener('click', () => setFilter(b.dataset.filter));
        });
        document.querySelectorAll('#langToggle button').forEach(b => {
            b.addEventListener('click', () => setLang(b.dataset.lang));
        });

        /* ---------- Modal ---------- */
        const overlay = document.getElementById('overlay');
        const modalVideoWrap = document.getElementById('modalVideoWrap');
        const modalBody = document.getElementById('modalBody');

        function openModal(p) {
            modalVideoWrap.innerHTML = p.video
                ? `<video src="${p.video}" controls preload="metadata"></video>`
                : `<span class="no-video">${t().noVideo}</span>`;

            modalBody.innerHTML = `
    <span class="modal-tag">${catLabel(p.category).toUpperCase()}</span>
    <h2>${field(p, 'title') || t().noTitle}</h2>
    <p class="d">${field(p, 'description') || ''}</p>
    
    ${p.objective || p.objective_en ? `
      <div style="margin-bottom: 20px;">
        <h3 style="font-size: 16px; margin: 0 0 6px;">${t().objectiveLabel}</h3>
        <p style="font-size: 14.5px; color: var(--muted); margin: 0; line-height: 1.65;">${field(p, 'objective') || ''}</p>
      </div>
    ` : ''}

    <div class="meta-row">
      <div class="meta-item"><div class="label">${t().toolsLabel}</div><div class="val">${field(p, 'tools') || t().dash}</div></div>
      <div class="meta-item"><div class="label">${t().dateLabel}</div><div class="val">${p.date || t().dash}</div></div>
    </div>
    ${p.link ? `<a class="modal-link" href="${p.link}" target="_blank" rel="noopener">${field(p, 'linkLabel') || t().viewLabel}${arrowIcon()}</a>` : ''}`;
            overlay.classList.add('open');
        }
        function closeModal() {
            overlay.classList.remove('open');
            modalVideoWrap.innerHTML = '';
        }
        document.getElementById('closeBtn').addEventListener('click', closeModal);
        overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        render();
    </script>
</body>

</html>
